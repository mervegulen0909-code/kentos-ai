services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kentos_ai
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kentos -d kentos_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio-prod-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set none local/${S3_BUCKET}
      "
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav-prod-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://kentos:${POSTGRES_PASSWORD}@postgres:5432/kentos_ai?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    command: ["pnpm", "--filter", "@kentos/api", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      DATABASE_URL: postgresql://kentos:${POSTGRES_PASSWORD}@postgres:5432/kentos_ai?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    command: ["pnpm", "--filter", "@kentos/worker", "start"]
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy

  admin-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    command: ["pnpm", "--filter", "@kentos/admin-web", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3101"]
    depends_on:
      api:
        condition: service_healthy

  citizen-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    command: ["pnpm", "--filter", "@kentos/citizen-web", "exec", "next", "start", "-H", "0.0.0.0", "-p", "3102"]
    depends_on:
      api:
        condition: service_healthy

  whatsapp-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      PORT: 3120
      KENTOS_API_BASE_URL: http://api:3100/api/v1
      WHATSAPP_OUTBOUND_LIVE: "false"
      INSTAGRAM_OUTBOUND_LIVE: "false"
      FACEBOOK_OUTBOUND_LIVE: "false"
      SMS_OUTBOUND_LIVE: "false"
    command: ["pnpm", "--filter", "@kentos/whatsapp-gateway", "start"]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-prod-data:/data
      - caddy-prod-config:/config
    depends_on:
      - api
      - admin-web
      - citizen-web
      - whatsapp-gateway

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
  clamav-prod-data:
  caddy-prod-data:
  caddy-prod-config:
