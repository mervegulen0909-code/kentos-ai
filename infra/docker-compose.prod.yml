services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kentos_ai
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kentos -d kentos_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio-prod-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set none local/${S3_BUCKET}
      "
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav-prod-data:/var/lib/clamav
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://kentos:${POSTGRES_PASSWORD}@postgres:5432/kentos_ai?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required for citizen auth}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:?FIREBASE_SERVICE_ACCOUNT_BASE64 is required for citizen auth}
    command: ["pnpm", "--filter", "@kentos/api", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3100/api/v1/health/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      DATABASE_URL: postgresql://kentos:${POSTGRES_PASSWORD}@postgres:5432/kentos_ai?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:?FIREBASE_SERVICE_ACCOUNT_BASE64 is required}
    command: ["pnpm", "--filter", "@kentos/worker", "start"]
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3130/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
    command:
      [
        "pnpm",
        "--filter",
        "@kentos/admin-web",
        "exec",
        "next",
        "start",
        "-H",
        "0.0.0.0",
        "-p",
        "3101",
      ]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3101/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  citizen-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?NEXT_PUBLIC_FIREBASE_API_KEY is required}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is required}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?NEXT_PUBLIC_FIREBASE_PROJECT_ID is required}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?NEXT_PUBLIC_FIREBASE_APP_ID is required}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
      NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    command:
      [
        "pnpm",
        "--filter",
        "@kentos/citizen-web",
        "exec",
        "next",
        "start",
        "-H",
        "0.0.0.0",
        "-p",
        "3102",
      ]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3102/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  whatsapp-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: ${PUBLIC_CITIZEN_BASE_URL}
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    environment:
      PORT: 3120
      KENTOS_API_BASE_URL: http://api:3100/api/v1
      PUBLIC_GATEWAY_BASE_URL: ${PUBLIC_GATEWAY_BASE_URL}
      WHATSAPP_OUTBOUND_LIVE: ${WHATSAPP_OUTBOUND_LIVE:-false}
      INSTAGRAM_OUTBOUND_LIVE: ${INSTAGRAM_OUTBOUND_LIVE:-false}
      FACEBOOK_OUTBOUND_LIVE: ${FACEBOOK_OUTBOUND_LIVE:-false}
      SMS_OUTBOUND_LIVE: ${SMS_OUTBOUND_LIVE:-false}
      EMAIL_OUTBOUND_LIVE: ${EMAIL_OUTBOUND_LIVE:-false}
    command: ["pnpm", "--filter", "@kentos/whatsapp-gateway", "start"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3120/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ../.env.production.local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-prod-data:/data
      - caddy-prod-config:/config
    depends_on:
      - api
      - admin-web
      - citizen-web
      - whatsapp-gateway

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGUSER: kentos
      PGDATABASE: kentos_ai
      RETENTION_DAYS: ${KENTOS_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache dcron > /dev/null 2>&1
        mkdir -p /backups
        cat > /cron-backup.sh << 'EOF'
        #!/bin/sh
        STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
        FILE="/backups/postgres-${STAMP}.sql.gz"
        pg_dump | gzip -9 > "$FILE" && echo "Backup OK: $FILE" || echo "Backup FAILED" >&2
        find /backups -name "postgres-*.sql.gz" -mtime +${RETENTION_DAYS:-14} -exec rm -f {} \;
        EOF
        chmod +x /cron-backup.sh
        echo "0 2 * * * /cron-backup.sh" | crontab -
        crond -f -l 6
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
  clamav-prod-data:
  caddy-prod-data:
  caddy-prod-config:
