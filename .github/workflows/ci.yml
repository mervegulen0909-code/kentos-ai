name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kentos
          POSTGRES_PASSWORD: kentos
          POSTGRES_DB: kentos_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kentos -d kentos_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://kentos:kentos@localhost:5432/kentos_ai?schema=public
      REDIS_URL: redis://localhost:6379
      KENTOS_API_BASE_URL: http://127.0.0.1:3110/api/v1
      INTERNAL_API_KEY: change-me-internal
      WIDGET_ORIGIN_ALLOWLIST: http://localhost:3002,http://127.0.0.1:3002
      PUBLIC_RATE_LIMIT_MAX: 240
      PUBLIC_RATE_LIMIT_WINDOW_MS: 60000
      JWT_ACCESS_SECRET: ci-test-access-secret-32-chars-minimum
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-minimum
      CORS_ORIGIN: http://localhost:3101,http://localhost:3102

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Database migrate
        run: pnpm db:migrate

      - name: Database seed
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (API)
        run: pnpm --filter @kentos/api test

      - name: Unit tests (Worker)
        run: pnpm --filter @kentos/worker test

      - name: Unit tests (Gateway)
        run: pnpm --filter @kentos/whatsapp-gateway test

      - name: Unit tests (Admin Web)
        run: pnpm --filter @kentos/admin-web test

      - name: Build
        run: pnpm build

      - name: Start API for smoke
        run: DATABASE_URL="$DATABASE_URL" PORT=3110 pnpm --filter @kentos/api dev > api.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3110/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check timed out"
          tail -n 200 api.log || true
          exit 1

      - name: API smoke
        run: pnpm smoke:api

  deploy:
    name: Deploy to Production
    needs: [verify]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/kentos
            git pull origin master
            pnpm install --frozen-lockfile
            pnpm db:generate
            pnpm db:migrate
            docker compose -f infra/docker-compose.prod.yml up -d --build --remove-orphans
            echo "Waiting for services to become healthy..."
            sleep 30
            ./infra/healthcheck-prod.sh
            echo "Deploy completed successfully"

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kentos
          POSTGRES_PASSWORD: kentos
          POSTGRES_DB: kentos_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kentos -d kentos_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://kentos:kentos@127.0.0.1:5432/kentos_ai?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      E2E_API_BASE_URL: http://127.0.0.1:3100/api/v1
      E2E_ADMIN_BASE_URL: http://127.0.0.1:3001
      E2E_CITIZEN_BASE_URL: http://127.0.0.1:3002
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Database migrate
        run: pnpm db:migrate

      - name: Database seed
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm e2e:install

      - name: UI E2E
        run: pnpm e2e
