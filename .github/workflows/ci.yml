name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kentos
          POSTGRES_PASSWORD: kentos
          POSTGRES_DB: kentos_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kentos -d kentos_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://kentos:kentos@localhost:5432/kentos_ai?schema=public
      REDIS_URL: redis://localhost:6379
      KENTOS_API_BASE_URL: http://127.0.0.1:3110/api/v1
      INTERNAL_API_KEY: change-me-internal
      INTERNAL_EVENTS_KEY: ci-test-events-secret-32-chars-minimum
      CITIZEN_SESSION_SECRET: ci-test-citizen-session-secret-32-chars-minimum
      AUTH_LOGIN_THROTTLE_LIMIT: 100
      CITIZEN_ERASURE_THROTTLE_LIMIT: 10
      WIDGET_ORIGIN_ALLOWLIST: http://localhost:3002,http://127.0.0.1:3002
      PUBLIC_RATE_LIMIT_MAX: 240
      PUBLIC_RATE_LIMIT_WINDOW_MS: 60000
      JWT_ACCESS_SECRET: ci-test-access-secret-32-chars-minimum
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-minimum
      CORS_ORIGIN: http://localhost:3101,http://localhost:3102
      ATTACHMENT_SCAN_PROVIDER: placeholder
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: kentos-ci
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Verify root script contracts
        run: |
          npm run verify -- --help
          npm run ops:preflight -- --help
          npm run ops:external -- --help
          npm run infra:prod:bootstrap -- --help

      - name: Prisma generate
        run: pnpm db:generate

      - name: Database migrate
        run: pnpm db:migrate

      - name: Database seed
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Unit tests (API)
        run: pnpm --filter @kentos/api test

      - name: Unit tests (Worker)
        run: pnpm --filter @kentos/worker test

      - name: Unit tests (Gateway)
        run: pnpm --filter @kentos/whatsapp-gateway test

      - name: Unit tests (Admin Web)
        run: pnpm --filter @kentos/admin-web test

      - name: Build
        run: pnpm build

      - name: Start API for smoke
        run: DATABASE_URL="$DATABASE_URL" PORT=3110 pnpm --filter @kentos/api dev > api.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3110/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check timed out"
          tail -n 200 api.log || true
          exit 1

      - name: API smoke
        run: pnpm smoke:api

  deploy:
    name: Deploy to Production
    needs: [verify, ui-e2e, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/kentos-ai
            git pull origin master
            pnpm install --frozen-lockfile
            pnpm ops:external -- --skip-network
            docker compose --env-file .env.production.local -f infra/docker-compose.prod.yml build
            docker compose --env-file .env.production.local -f infra/docker-compose.prod.yml up -d postgres redis minio minio-init
            docker compose --env-file .env.production.local -f infra/docker-compose.prod.yml up -d --force-recreate clamav
            docker compose --env-file .env.production.local -f infra/docker-compose.prod.yml run --rm api pnpm db:deploy
            docker compose --env-file .env.production.local -f infra/docker-compose.prod.yml up -d --remove-orphans
            echo "Waiting for services to become healthy..."
            sleep 30
            ./infra/healthcheck-prod.sh
            pnpm ops:external -- --strict-launch --compose
            echo "Deploy completed successfully"

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kentos
          POSTGRES_PASSWORD: kentos
          POSTGRES_DB: kentos_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kentos -d kentos_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://kentos:kentos@127.0.0.1:5432/kentos_ai?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      E2E_API_BASE_URL: http://127.0.0.1:3100/api/v1
      E2E_ADMIN_BASE_URL: http://127.0.0.1:3001
      E2E_CITIZEN_BASE_URL: http://127.0.0.1:3002
      E2E_CITIZEN_SESSION_SECRET: ci-e2e-citizen-session-secret-32-chars-minimum
      JWT_ACCESS_SECRET: ci-e2e-access-secret-32-chars-minimum
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-32-chars-minimum
      CITIZEN_SESSION_SECRET: ci-e2e-citizen-session-secret-32-chars-minimum
      INTERNAL_API_KEY: ci-e2e-internal-key-32-chars-minimum
      INTERNAL_EVENTS_KEY: ci-e2e-events-key-32-chars-minimum
      AUTH_LOGIN_THROTTLE_LIMIT: 100
      CITIZEN_ERASURE_THROTTLE_LIMIT: 10
      CORS_ORIGIN: http://127.0.0.1:3001,http://127.0.0.1:3002
      PUBLIC_API_BASE_URL: http://127.0.0.1:3100/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3100/api/v1
      NEXT_PUBLIC_PUBLIC_API_BASE_URL: http://127.0.0.1:3100/api/v1
      NEXT_PUBLIC_CITIZEN_WEB_BASE_URL: http://127.0.0.1:3002
      ATTACHMENT_SCAN_PROVIDER: placeholder
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: kentos-e2e
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true
      WIDGET_ORIGIN_ALLOWLIST: http://127.0.0.1:3002
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Database migrate
        run: pnpm db:migrate

      - name: Database seed
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm e2e:install

      - name: Start S3-compatible attachment storage
        run: |
          docker run -d --name kentos-e2e-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c \
            "until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/kentos-e2e"

      - name: Start E2E applications
        run: |
          PORT=3100 pnpm --filter @kentos/api dev > api-e2e.log 2>&1 &
          pnpm --filter @kentos/admin-web exec next dev -p 3001 > admin-e2e.log 2>&1 &
          pnpm --filter @kentos/citizen-web exec next dev -p 3002 > citizen-e2e.log 2>&1 &

      - name: Wait for E2E applications
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/api/v1/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3001/login >/dev/null \
              && curl -fsS http://127.0.0.1:3002/demo-belediye/report >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 api-e2e.log admin-e2e.log citizen-e2e.log || true
          exit 1

      - name: UI E2E
        run: pnpm e2e

  security:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
